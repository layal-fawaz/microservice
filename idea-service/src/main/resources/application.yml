server:
  port: 9004

spring:
  application:
    name: idea-service

  datasource:
    url: jdbc:h2:mem:idea_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

payment-service:
  url: http://localhost:9007

rabbitmq:
  queue: idea.analysis.queue
  exchange: idea.exchange
  routing-key: idea.analysis
